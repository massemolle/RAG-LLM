# Policy Matrix Configuration
# Maps (content_category, intent_class) -> (severity, response_mode, rationale)
# This is the single source of truth for guardrails decisions

policies:
  # Help-seeking queries: ALLOWED
  - category: harassment
    intent: help_seeking
    severity: allowed
    response_mode: answer_normally
    rationale: "Help-seeking query about harassment - provide supportive guidance"
    confidence: 1.0
  
  - category: harassment
    intent: reporting
    severity: allowed
    response_mode: escalate_or_resources
    rationale: "Reporting query about harassment - provide resources and escalation"
    confidence: 1.0
  
  - category: violence
    intent: help_seeking
    severity: allowed
    response_mode: answer_normally
    rationale: "Help-seeking query about violence - provide supportive guidance"
    confidence: 1.0
  
  - category: self_harm
    intent: help_seeking
    severity: allowed
    response_mode: escalate_or_resources
    rationale: "Help-seeking query about self-harm - provide resources and hotlines"
    confidence: 1.0
  
  - category: cyber_attack
    intent: help_seeking
    severity: allowed
    response_mode: answer_normally
    rationale: "Help-seeking query about cyber attacks - provide supportive guidance"
    confidence: 1.0
  
  # Prevention/Education: ALLOWED (constrained)
  - category: cyber_attack
    intent: prevention
    severity: allowed
    response_mode: answer_safely_constrained
    rationale: "Prevention/education query about cyber attacks - provide high-level guidance"
    confidence: 1.0
  
  - category: violence
    intent: prevention
    severity: allowed
    response_mode: answer_safely_constrained
    rationale: "Prevention/education query about violence - provide high-level guidance"
    confidence: 1.0
  
  - category: harassment
    intent: prevention
    severity: allowed
    response_mode: answer_safely_constrained
    rationale: "Prevention/education query about harassment - provide high-level guidance"
    confidence: 1.0
  
  # Wrongdoing instructions: BLOCKED
  - category: harassment
    intent: wrongdoing_instructions
    severity: blocked
    response_mode: refuse_with_safe_alternatives
