allow_collections:
- grid_ops
- safety_bulletins
allow_dirs:
- C:/Users/user/Documents/GitHub/RAG-LLM/database
blocked_patterns:
  pii:
  - \b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b
  - \b(\+352)?\s?\d{3}[\s.-]?\d{3}[\s.-]?\d{3}\b
  prompt_injection:
  - (?i)ignore (all|any|previous|prior) (instructions|prompt)
  - (?i)disclose|reveal (system|developer) prompt
  - (?i)perform .* (curl|wget|powershell)
  secrets:
  - (?i)api[_-]?key|token|secret
logging:
  path: ./logs/audit.jsonl
  redact_fields:
  - user_query
  - tool_args
  retention_days: 30
mode: monitor
output:
  allow_general_if_no_docs: true
  auto_cite_if_missing: true
  cite_or_silent: true
provider:
  azure_deployment: ''
  llm: local
rbac:
  roles:
    admin:
      can_upload: true
      can_use_tools: true
    analyst:
      can_upload: false
      can_use_tools: false
retrieval:
  max_chunks: 4
  min_rel: 0.6
  require_exact_terms: true
safe_mode: true
